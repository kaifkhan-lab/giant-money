# Giant Money on Fly.io
# Deploy:  fly launch --no-deploy   (first time, creates the app)
#          fly volumes create gm_data --size 1
#          fly deploy
app = "giant-money"
primary_region = "iad"          # Virginia — closest to the SEC/market data sources

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  NODE_ENV = "production"

# SQLite lives on this volume, so the database survives every redeploy.
[[mounts]]
  source = "gm_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler must keep polling filings 24/7, so the machine never stops.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
