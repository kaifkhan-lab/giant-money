<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Scene 2 · "A lone horse rider carrying a sealed letter across misty countryside."
       Same locked template as Scene 1 (design/scene-template.md):
       identical palette, lighting, composition, grain — identical motion tokens. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A11"/>
      <stop offset=".62" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#0D1119"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1018"/>
      <stop offset=".5" stop-color="#090D14"/>
      <stop offset="1" stop-color="#070A10"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C7CEDC" stop-opacity=".13"/>
      <stop offset=".55" stop-color="#C7CEDC" stop-opacity=".05"/>
      <stop offset="1" stop-color="#C7CEDC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlowWide" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#AEB6C6" stop-opacity=".07"/>
      <stop offset="1" stop-color="#AEB6C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8934A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D4AC5E" stop-opacity=".85"/>
      <stop offset="1" stop-color="#B8934A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldTrail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A75A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C9A75A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C1D0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B9C1D0" stop-opacity=".06"/>
      <stop offset="1" stop-color="#B9C1D0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <style>
      /* ── motion design system · identical tokens to Scene 1 — never edited ── */
      #cam, #subjectRock, #mistA, #mistB, #trail, #hairlines, #glowBand { transform-box: fill-box; }
      #cam { transform-origin: 63% 67%; animation: camBreathe 26s ease-in-out infinite alternate; }
      @keyframes camBreathe { from { transform: scale(1); } to { transform: scale(1.02); } }
      #subjectRock { transform-origin: 50% 88%; animation: rock 7.5s ease-in-out infinite alternate; }
      @keyframes rock {
        from { transform: rotate(-0.35deg) translateY(0px); }
        to   { transform: rotate(0.35deg)  translateY(-2.2px); }
      }
      #trail { animation: shimmer 8s ease-in-out infinite alternate; }
      @keyframes shimmer {
        from { opacity: .78; transform: translateX(0px); }
        to   { opacity: 1;   transform: translateX(1.6px); }
      }
      #hairlines { animation: hairBreathe 11s ease-in-out 2s infinite alternate; }
      @keyframes hairBreathe { from { opacity: .72; } to { opacity: 1; } }
      #mistA { animation: driftA 30s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
      #mistB { animation: driftB 21s ease-in-out infinite alternate; }
      @keyframes driftB { from { transform: translateX(10px); } to { transform: translateX(-14px); } }
      #glowBand { animation: lightBreathe 13s ease-in-out infinite alternate; }
      @keyframes lightBreathe { from { opacity: .955; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #cam, #subjectRock, #mistA, #mistB, #trail, #hairlines, #glowBand { animation: none; }
      }
    </style>
  </defs>

  <g id="cam">
    <!-- sky: vast negative space for overlay text -->
    <rect x="-40" y="-24" width="2000" height="754" fill="url(#sky)"/>

    <!-- single soft light source at the horizon (breathes ≤5%) -->
    <g id="glowBand">
      <ellipse cx="1140" cy="726" rx="760" ry="150" fill="url(#horizonGlowWide)"/>
      <ellipse cx="1190" cy="725" rx="430" ry="80" fill="url(#horizonGlow)"/>
      <ellipse cx="1235" cy="723" rx="560" ry="52" fill="url(#horizonGlow)" opacity="1.5"/>
      <ellipse cx="1235" cy="722" rx="380" ry="26" fill="#C7CEDC" opacity=".065"/>
    </g>

    <!-- distant ridge, then rolling countryside ground -->
    <path d="M -40 714 C 320 704, 720 718, 1140 708 C 1460 701, 1740 712, 1960 706 L 1960 736 L -40 736 Z" fill="#0C1018" opacity=".55"/>
    <path d="M -40 734 C 300 722, 700 740, 1100 730 C 1400 723, 1700 735, 1960 728 L 1960 1104 L -40 1104 Z" fill="url(#ground)"/>
    <!-- horizon hairline along the ridge -->
    <path d="M -40 733 C 300 721, 700 739, 1100 729 C 1400 722, 1700 734, 1960 727" stroke="#AEB6C6" stroke-width="1.1" fill="none" opacity=".10"/>
    <path d="M 660 731 C 900 736, 1150 727, 1520 726" stroke="url(#goldLine)" stroke-width="1.4" fill="none" opacity=".38"/>

    <!-- atmospheric haze separating subject from background -->
    <rect x="-40" y="688" width="2000" height="72" fill="url(#mist)"/>
    <ellipse id="mistA" cx="620" cy="716" rx="520" ry="26" fill="#B9C1D0" opacity=".028" filter="url(#soft)"/>
    <ellipse id="mistB" cx="1560" cy="706" rx="420" ry="20" fill="#B9C1D0" opacity=".022" filter="url(#soft)"/>

    <!-- ── lone courier rider · small backlit silhouette, right third ── -->
    <g id="subjectRock">
      <g transform="translate(1230 700) scale(1.22) translate(-1230 -700)">
        <!-- ground contact shadow (behind legs) -->
        <ellipse cx="1232" cy="727" rx="95" ry="6" fill="#04060A" opacity=".55" filter="url(#soft2)"/>
        <!-- horse legs · walk pose: two planted, two in motion -->
        <g stroke="#05070C" stroke-width="6.5" stroke-linecap="round" fill="none">
          <path d="M 1186 668 L 1183 726"/>
          <path d="M 1198 670 C 1205 688, 1207 702, 1200 722"/>
          <path d="M 1268 672 L 1273 726"/>
          <path d="M 1282 666 C 1292 686, 1299 706, 1306 722"/>
        </g>
        <!-- tail -->
        <path d="M 1292 646 C 1304 660, 1308 678, 1300 698" stroke="#05070C" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- horse · one continuous silhouette: muzzle → poll → crest → back → rump → belly → chest → throat -->
        <path d="M 1120 612
                 C 1126 606, 1136 598, 1144 593
                 L 1148 590
                 C 1156 586, 1164 592, 1170 600
                 C 1178 612, 1184 624, 1192 632
                 C 1206 628, 1240 626, 1266 630
                 C 1280 632, 1290 638, 1294 648
                 C 1296 658, 1290 668, 1280 672
                 C 1256 680, 1216 682, 1194 676
                 C 1182 672, 1174 664, 1170 654
                 C 1164 644, 1156 634, 1146 628
                 C 1138 624, 1128 622, 1120 620
                 Z" fill="#05070C"/>
        <!-- ears · tiny -->
        <path d="M 1146 592 L 1141 581 L 1151 588 Z" fill="#05070C"/>
        <path d="M 1153 589 L 1151 579 L 1159 587 Z" fill="#05070C"/>
        <!-- rider · seated in contact with the back, leaning gently forward -->
        <path d="M 1224 630 C 1222 614, 1226 600, 1235 593 C 1243 587, 1251 593, 1249 603 C 1246 614, 1244 622, 1244 632 Z" fill="#05070C"/>
        <circle cx="1239" cy="580" r="7.5" fill="#05070C"/>
        <!-- cloak hint flowing behind -->
        <path d="M 1245 598 C 1257 606, 1262 620, 1256 632 L 1245 633 Z" fill="#05070C" opacity=".9"/>
        <!-- forward arm to the rein -->
        <path d="M 1231 602 L 1212 612" stroke="#05070C" stroke-width="4.5" stroke-linecap="round"/>
        <!-- hanging leg along the barrel -->
        <path d="M 1236 632 C 1233 650, 1233 662, 1237 671" stroke="#05070C" stroke-width="5.5" stroke-linecap="round" fill="none"/>
        <!-- rein · hairline silver from hand to the poll -->
        <path d="M 1212 611 L 1154 597" stroke="#9AA3B5" stroke-width="1" opacity=".42"/>
        <!-- satchel at the hip, strapped · THE gold accent (sealed letter) -->
        <path d="M 1242 596 L 1252 618" stroke="#9AA3B5" stroke-width="1" opacity=".35"/>
        <rect x="1246" y="616" width="14" height="10" rx="2" fill="#05070C" stroke="#AEB6C6" stroke-opacity=".35" stroke-width="1"/>
        <path d="M 1246 619 L 1260 619" stroke="#C9A75A" stroke-width="1.3" opacity=".9"/>
        <circle cx="1253" cy="621.5" r="2.2" fill="#C9A75A" opacity=".95"/>
        <!-- silver rim light · along the back and rider's shoulder (backlit) -->
        <path d="M 1194 631 C 1222 626, 1252 626, 1288 636" stroke="#C7CEDC" stroke-width="1.2" fill="none" opacity=".5"/>
        <path d="M 1231 593 C 1236 589, 1243 589, 1247 594" stroke="#C7CEDC" stroke-width="1" fill="none" opacity=".38"/>
      </g>
    </g>

    <!-- track glint · liquid-metal gold on the worn path -->
    <g id="trail">
      <rect x="1120" y="737" width="230" height="2" fill="url(#goldLine)"/>
      <g fill="url(#goldTrail)">
        <rect x="1300" y="746" width="86" height="1.5" opacity=".7"/>
        <rect x="1330" y="760" width="52" height="1.4" opacity=".55"/>
        <rect x="1316" y="780" width="66" height="1.2" opacity=".4"/>
        <rect x="1352" y="808" width="36" height="1.1" opacity=".3"/>
        <rect x="1336" y="844" width="48" height="1" opacity=".2"/>
        <rect x="1360" y="890" width="26" height="1" opacity=".13"/>
      </g>
    </g>

    <!-- calm field hairlines (furrows) -->
    <g id="hairlines" stroke="#AEB6C6" stroke-width="1">
      <line x1="180" y1="772" x2="640" y2="770" opacity=".045"/>
      <line x1="960" y1="798" x2="1520" y2="795" opacity=".04"/>
      <line x1="300" y1="842" x2="880" y2="840" opacity=".035"/>
      <line x1="1300" y1="928" x2="1820" y2="925" opacity=".03"/>
      <line x1="90" y1="972" x2="560" y2="970" opacity=".025"/>
    </g>
  </g>

  <!-- faint film grain — static, outside the camera move -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".5"/>
</svg>
