<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Scene 3 · "A brass ticker machine on a lone desk in an empty exchange hall."
       Same locked template (design/scene-template.md): identical palette, lighting,
       composition, grain — identical motion tokens. Gold = tape glint only. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A11"/>
      <stop offset=".62" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#0D1119"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1018"/>
      <stop offset=".5" stop-color="#090D14"/>
      <stop offset="1" stop-color="#070A10"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C7CEDC" stop-opacity=".13"/>
      <stop offset=".55" stop-color="#C7CEDC" stop-opacity=".05"/>
      <stop offset="1" stop-color="#C7CEDC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlowWide" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#AEB6C6" stop-opacity=".07"/>
      <stop offset="1" stop-color="#AEB6C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8934A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D4AC5E" stop-opacity=".85"/>
      <stop offset="1" stop-color="#B8934A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldTrail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A75A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C9A75A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C1D0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B9C1D0" stop-opacity=".06"/>
      <stop offset="1" stop-color="#B9C1D0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7CEDC" stop-opacity=".07"/>
      <stop offset="1" stop-color="#C7CEDC" stop-opacity=".015"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <style>
      /* ── motion design system · identical tokens — never edited ── */
      #cam, #subjectRock, #mistA, #mistB, #trail, #hairlines, #glowBand { transform-box: fill-box; }
      #cam { transform-origin: 63% 67%; animation: camBreathe 26s ease-in-out infinite alternate; }
      @keyframes camBreathe { from { transform: scale(1); } to { transform: scale(1.02); } }
      #subjectRock { transform-origin: 50% 12%; animation: rock 7.5s ease-in-out infinite alternate; }
      @keyframes rock {
        from { transform: rotate(-0.35deg) translateY(0px); }
        to   { transform: rotate(0.35deg)  translateY(-2.2px); }
      }
      #trail { animation: shimmer 8s ease-in-out infinite alternate; }
      @keyframes shimmer {
        from { opacity: .78; transform: translateX(0px); }
        to   { opacity: 1;   transform: translateX(1.6px); }
      }
      #hairlines { animation: hairBreathe 11s ease-in-out 2s infinite alternate; }
      @keyframes hairBreathe { from { opacity: .72; } to { opacity: 1; } }
      #mistA { animation: driftA 30s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
      #mistB { animation: driftB 21s ease-in-out infinite alternate; }
      @keyframes driftB { from { transform: translateX(10px); } to { transform: translateX(-14px); } }
      #glowBand { animation: lightBreathe 13s ease-in-out infinite alternate; }
      @keyframes lightBreathe { from { opacity: .955; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #cam, #subjectRock, #mistA, #mistB, #trail, #hairlines, #glowBand { animation: none; }
      }
    </style>
  </defs>

  <g id="cam">
    <!-- hall gloom: vast negative space for overlay text -->
    <rect x="-40" y="-24" width="2000" height="758" fill="url(#sky)"/>

    <!-- tall exchange-hall windows, far and faint (the single light source) -->
    <g filter="url(#soft)">
      <rect x="270" y="560" width="46" height="170" fill="url(#windowGlow)"/>
      <rect x="420" y="572" width="38" height="158" fill="url(#windowGlow)" opacity=".8"/>
      <rect x="560" y="582" width="30" height="148" fill="url(#windowGlow)" opacity=".55"/>
    </g>

    <!-- light pooling at the floor line (breathes ≤5%) -->
    <g id="glowBand">
      <ellipse cx="1140" cy="730" rx="760" ry="150" fill="url(#horizonGlowWide)"/>
      <ellipse cx="1190" cy="729" rx="430" ry="80" fill="url(#horizonGlow)"/>
      <ellipse cx="1235" cy="727" rx="560" ry="52" fill="url(#horizonGlow)" opacity="1.5"/>
      <ellipse cx="1235" cy="726" rx="380" ry="26" fill="#C7CEDC" opacity=".065"/>
    </g>

    <!-- wall / polished floor junction in the lower third -->
    <rect x="-40" y="730" width="2000" height="374" fill="url(#ground)"/>
    <rect x="-40" y="729.4" width="2000" height="1.2" fill="#AEB6C6" opacity=".10"/>
    <rect x="640" y="729.2" width="900" height="1.4" fill="url(#goldLine)" opacity=".38"/>

    <!-- dust haze hanging in the hall -->
    <rect x="-40" y="694" width="2000" height="72" fill="url(#mist)"/>
    <ellipse id="mistA" cx="620" cy="722" rx="520" ry="26" fill="#B9C1D0" opacity=".028" filter="url(#soft)"/>
    <ellipse id="mistB" cx="1560" cy="712" rx="420" ry="20" fill="#B9C1D0" opacity=".022" filter="url(#soft)"/>

    <!-- ── the ticker machine on a lone desk · right third ── -->
    <g transform="translate(1230 690) scale(1.22) translate(-1230 -690)">
      <!-- floor contact shadow -->
      <ellipse cx="1240" cy="728" rx="105" ry="6" fill="#04060A" opacity=".55" filter="url(#soft2)"/>
      <!-- desk -->
      <rect x="1152" y="678" width="176" height="7" rx="2" fill="#05070C"/>
      <rect x="1162" y="685" width="5" height="42" fill="#05070C"/>
      <rect x="1310" y="685" width="5" height="42" fill="#05070C"/>
      <path d="M 1154 679 L 1326 679" stroke="#C7CEDC" stroke-width="1" opacity=".35"/>
      <!-- machine base -->
      <rect x="1216" y="652" width="40" height="27" rx="5" fill="#05070C"/>
      <!-- glass dome, backlit -->
      <path d="M 1218 652 C 1218 620, 1254 620, 1254 652 Z" fill="rgba(199,206,220,.035)"/>
      <path d="M 1218 652 C 1218 620, 1254 620, 1254 652" stroke="#C7CEDC" stroke-width="1.3" fill="none" opacity=".5"/>
      <!-- print wheel inside -->
      <rect x="1229" y="636" width="14" height="11" rx="2.5" fill="#05070C"/>
      <path d="M 1224 641 L 1248 641" stroke="#05070C" stroke-width="2"/>
      <!-- the tape · silk in still air (carries the rock token) -->
      <g id="subjectRock">
        <path d="M 1254 648 C 1276 654, 1294 662, 1302 676 C 1310 692, 1312 708, 1308 724
                 C 1298 728, 1288 724, 1286 716 C 1284 708, 1292 704, 1298 708"
              stroke="#C7CEDC" stroke-width="3" fill="none" opacity=".3" stroke-linecap="round"/>
      </g>
      <!-- rim light on the desk edge -->
      <path d="M 1216 653 L 1256 653" stroke="#C7CEDC" stroke-width="1" opacity=".3"/>
    </g>

    <!-- tape glint · liquid-metal gold along the ribbon and pooling on the floor -->
    <g id="trail">
      <path d="M 1272 660 C 1290 668, 1302 680, 1308 696" stroke="#C9A75A" stroke-width="1.2" fill="none" opacity=".85" stroke-linecap="round"/>
      <rect x="1160" y="740" width="230" height="2" fill="url(#goldLine)"/>
      <g fill="url(#goldTrail)">
        <rect x="1300" y="748" width="72" height="1.5" opacity=".7"/>
        <rect x="1322" y="762" width="46" height="1.4" opacity=".55"/>
        <rect x="1308" y="782" width="58" height="1.2" opacity=".4"/>
        <rect x="1338" y="810" width="32" height="1.1" opacity=".3"/>
        <rect x="1322" y="846" width="42" height="1" opacity=".2"/>
      </g>
    </g>

    <!-- polished floor reflections -->
    <g id="hairlines" stroke="#AEB6C6" stroke-width="1">
      <line x1="180" y1="775" x2="640" y2="775" opacity=".045"/>
      <line x1="960" y1="800" x2="1520" y2="800" opacity=".04"/>
      <line x1="300" y1="845" x2="880" y2="845" opacity=".035"/>
      <line x1="1300" y1="930" x2="1820" y2="930" opacity=".03"/>
      <line x1="90" y1="975" x2="560" y2="975" opacity=".025"/>
    </g>
  </g>

  <!-- faint film grain — static, outside the camera move -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".5"/>
</svg>
